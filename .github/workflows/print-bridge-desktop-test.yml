name: Print Bridge Desktop - test installers

on:
  push:
    branches:
      - v2.15.0-print-bridge-desktop
    paths:
      - '.github/workflows/print-bridge-desktop-test.yml'
      - 'print-bridge/desktop/**'
      - 'print-bridge/**'
      - 'print-bridge/desktopPairing.js'
      - 'print-bridge/pair.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/v2.15.0-print-bridge-desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            artifact: print-bridge-macos-test
          - os: windows-2022
            platform: win
            artifact: print-bridge-windows-test

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare isolated Desktop package
        id: prepare
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { preparaBuild } =
            require("./print-bridge/desktop/preparaBuild");

          const result = preparaBuild();

          if (result.files !== 23) {
            throw new Error("Unexpected package contents");
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            "directory=" + result.directory + "\n"
          );

          console.log("ISOLATED_PACKAGE_OK");
          NODE

      - name: Install isolated build dependencies
        working-directory: ${{ steps.prepare.outputs.directory }}
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Compile universal macOS USB helper
        if: matrix.platform == 'mac'
        shell: bash
        run: >
          node print-bridge/desktop/preparaHelperMac.js
          "${{ steps.prepare.outputs.directory }}" --build

      - name: Verify Windows printer discovery runtime
        if: matrix.platform == 'win'
        working-directory: ${{ steps.prepare.outputs.directory }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "WINDOWS_POWERSHELL_OK"

          $printers = Get-CimInstance Win32_Printer |
            Select-Object Name, PortName, DriverName, WorkOffline

          $printers |
            ConvertTo-Json -Compress |
            Write-Host

          node --check print-bridge/scopriStampanti.js
          node --check print-bridge/stampaLocale.js

          node -e "const d=require('./print-bridge/scopriStampanti'); const p=d.scopriStampanti(); if(!Array.isArray(p)){throw new Error('Discovery result is not an array');} console.log('WINDOWS_DISCOVERY_OK count=' + p.length);"

          node -e "const s=require('./print-bridge/stampaLocale'); if(typeof s.stampaTesto !== 'function'){throw new Error('stampaTesto missing');} console.log('WINDOWS_PRINT_MODULE_OK');"

      - name: Build test installer without publishing
        working-directory: ${{ steps.prepare.outputs.directory }}
        shell: bash
        run: >
          npx --no-install electron-builder
          --config electron-builder.json
          --${{ matrix.platform }}
          --publish never

      - name: Store private test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.prepare.outputs.directory }}/dist-test/
          retention-days: 7
          if-no-files-found: error
