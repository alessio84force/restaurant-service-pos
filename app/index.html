<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Restaurant Service POS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/app/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/app/assets/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/app/assets/favicon-512x512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/app/assets/apple-touch-icon.png">
</head>
<body>

<header>
  <h1>Restaurant Service POS</h1>
  <p>La gestión completa de tu restaurante</p>
</header>

<main>
  <section class="mesas">
    <h2>Mesas</h2>
    <div class="grid-mesas"></div>
  </section>

  <section class="pedido">
    <h2>Pedido seleccionado</h2>
    <div id="detalle-pedido">
      Selecciona una mesa para ver el pedido.
    </div>
  </section>

  <section class="productos">
    <h2>Productos</h2>
    <div id="lista-productos">
      Selecciona una mesa para añadir productos.
    </div>
  </section>
<aside id="panel-producto" class="panel-producto oculto"></aside>
</main>

<script src="script.js"></script>
</body>
</html>
