<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Restaurant Service POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="stylesheet" href="css/mobile.css?v=2101a">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/app/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/app/assets/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/app/assets/favicon-512x512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/app/assets/apple-touch-icon.png">
</head>
<body>

<header class="mobile-topbar">
  <div>
    <strong>Restaurant Service</strong>
    <span id="mobile-subtitulo">Camarero móvil</span>
  </div>
  <button id="mobile-actualizar" onclick="recargarTodoMobile()">Actualizar</button>
</header>

<nav class="mobile-tabs">
  <button id="tab-mesas" onclick="cambiarVistaMobile('mesas')">Mesas</button>
  <button id="tab-pedido" onclick="cambiarVistaMobile('pedido')">Pedido</button>
  <button id="tab-productos" onclick="cambiarVistaMobile('productos')">Productos</button>
</nav>

<main id="mobile-app">
  <section id="mobile-loading-inicial" class="mobile-loading">
    Cargando POS móvil...
  </section>
</main>

<footer id="mobile-footer" class="mobile-footer">
  <a id="mobile-configuracion" href="/configuracion" hidden>Configuración</a>
  <a id="mobile-salir" href="/logout">Salir</a>
</footer>

<div id="mobile-toast"></div>
<div id="mobile-modal"></div>

<script src="js/mobile.js?v=2120a"></script>
</body>
</html>
